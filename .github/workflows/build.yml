name: Build SATISFY Health Bridge v0.4.0

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Rebuild Android project structure
        shell: bash
        run: |
          set -e

          echo "===== CLEAN ====="

          rm -rf app
          rm -rf apk-output


          echo "===== CREATE ====="

          mkdir -p app/libs
          mkdir -p app/src/main/java/com/satisfy/healthreader
          mkdir -p app/src/main/res/values


          echo "===== COPY SAMSUNG SDK ====="

          cp samsung-health-data-api-1.1.0.aar \
            app/libs/samsung-health-data-api-1.1.0.aar


          echo "===== COPY APP FILES ====="

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          cp MainActivity.kt \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt

          cp styles.xml \
            app/src/main/res/values/styles.xml


          echo "===== FILE LIST ====="

          find app -type f | sort


          echo "===== SAMSUNG SDK ====="

          ls -lh \
            app/libs/samsung-health-data-api-1.1.0.aar

          sha256sum \
            app/libs/samsung-health-data-api-1.1.0.aar


      - name: Write root Gradle files
        shell: bash
        run: |
          set -e

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.parcelize") version "2.0.21" apply false
          }
          EOF


          cat > settings.gradle.kts <<'EOF'
          pluginManagement {

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }


          rootProject.name =
              "SATISFY-HealthBridge-v040"


          include(":app")
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


      - name: Write app Gradle
        shell: bash
        run: |
          set -e

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.parcelize")
          }


          android {

              namespace =
                  "com.satisfy.healthreader"


              compileSdk =
                  35


              defaultConfig {

                  applicationId =
                      "com.satisfy.healthreader"

                  minSdk =
                      29

                  targetSdk =
                      35

                  versionCode =
                      40

                  versionName =
                      "0.4.0"
              }


              compileOptions {

                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }


              kotlinOptions {

                  jvmTarget =
                      "17"
              }


              buildTypes {

                  debug {

                      isMinifyEnabled =
                          false
                  }
              }
          }


          dependencies {

              /*
               * Samsung Health Data SDK 1.1.0
               */

              implementation(
                  files(
                      "libs/samsung-health-data-api-1.1.0.aar"
                  )
              )


              /*
               * Samsung SDK runtime
               */

              implementation(
                  "org.jetbrains.kotlin:kotlin-parcelize-runtime:2.0.21"
              )


              implementation(
                  "com.google.code.gson:gson:2.11.0"
              )


              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
              )


              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
              )


              /*
               * Android
               */

              implementation(
                  "androidx.core:core-ktx:1.15.0"
              )


              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )


              implementation(
                  "com.google.android.material:material:1.12.0"
              )


              implementation(
                  "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
              )


              /*
               * Wear OS Data Layer
               */

              implementation(
                  "com.google.android.gms:play-services-wearable:18.2.0"
              )


              /*
               * Task.await()
               */

              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
              )
          }
          EOF


      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e


          echo "===== VERSION ====="

          grep -n "versionCode" \
            app/build.gradle.kts

          grep -n "versionName" \
            app/build.gradle.kts


          echo "===== SAMSUNG RUNTIME ====="

          grep -n "parcelize" \
            app/build.gradle.kts

          grep -n "gson" \
            app/build.gradle.kts

          grep -n "coroutines" \
            app/build.gradle.kts


          echo "===== WEAR DATA LAYER ====="

          grep -n "play-services-wearable" \
            app/build.gradle.kts

          grep -n "coroutines-play-services" \
            app/build.gradle.kts


      - name: Verify Health Bridge source
        shell: bash
        run: |
          set -e


          echo "===== SAMSUNG HEALTH ====="

          grep -n "ENERGY_SCORE" \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt \
            || true

          grep -n "SLEEP_SCORE" \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt \
            || true


          echo "===== DATA LAYER ====="

          grep -n "satisfy/health_scores" \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt \
            || true

          grep -n "getNodeClient" \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt \
            || true

          grep -n "putDataItem" \
            app/src/main/java/com/satisfy/healthreader/MainActivity.kt \
            || true


      - name: Show runtime dependency tree
        shell: bash
        run: |
          set -e


          echo "===== DEBUG RUNTIME CLASSPATH ====="


          gradle \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon


      - name: Build APK
        shell: bash
        run: |
          set -e


          echo "===== BUILD START ====="


          gradle \
            clean \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --rerun-tasks


          echo "===== BUILD COMPLETE ====="


      - name: Find APK
        shell: bash
        run: |
          set -e


          echo "===== APK FILES ====="


          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      - name: Collect APK
        shell: bash
        run: |
          set -e


          mkdir -p apk-output


          APK=$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )


          if [ -z "$APK" ]; then

              echo "ERROR: APK not found"

              exit 1

          fi


          cp "$APK" \
            apk-output/SATISFY_HealthBridge_PHONE_v0.4.0.apk


          echo "===== FINAL APK ====="


          ls -lh \
            apk-output/SATISFY_HealthBridge_PHONE_v0.4.0.apk


          echo "===== SHA256 ====="


          sha256sum \
            apk-output/SATISFY_HealthBridge_PHONE_v0.4.0.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: SATISFY-HealthBridge-PHONE-v0.4.0-APK

          path: apk-output/SATISFY_HealthBridge_PHONE_v0.4.0.apk

          if-no-files-found: error
