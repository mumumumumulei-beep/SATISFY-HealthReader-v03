name: Build SATISFY Health Reader v0.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/libs
          mkdir -p app/src/main/java/com/satisfy/healthreader
          mkdir -p app/src/main/res/values

          cp samsung-health-data-api-1.1.0.aar app/libs/samsung-health-data-api-1.1.0.aar
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/satisfy/healthreader/MainActivity.kt
          cp styles.xml app/src/main/res/values/styles.xml

          echo "Project files:"
          find app -type f | sort

      - name: Write root Gradle files
        shell: bash
        run: |
          set -e

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application") version "8.7.3" apply false' \
          '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false' \
          '}' \
          > build.gradle.kts

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "SATISFY-HealthReader-v03"' \
          'include(":app")' \
          > settings.gradle.kts

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' \
          'kotlin.code.style=official' \
          > gradle.properties

          echo "===== build.gradle.kts ====="
          cat build.gradle.kts

          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

      - name: Write app Gradle
        shell: bash
        run: |
          set -e

          mkdir -p app

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application")' \
          '    id("org.jetbrains.kotlin.android")' \
          '}' \
          '' \
          'android {' \
          '    namespace = "com.satisfy.healthreader"' \
          '    compileSdk = 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId = "com.satisfy.healthreader"' \
          '        minSdk = 29' \
          '        targetSdk = 35' \
          '        versionCode = 3' \
          '        versionName = "0.3.0"' \
          '    }' \
          '' \
          '    compileOptions {' \
          '        sourceCompatibility = JavaVersion.VERSION_17' \
          '        targetCompatibility = JavaVersion.VERSION_17' \
          '    }' \
          '' \
          '    kotlinOptions {' \
          '        jvmTarget = "17"' \
          '    }' \
          '}' \
          '' \
          'dependencies {' \
          '    implementation(files("libs/samsung-health-data-api-1.1.0.aar"))' \
          '    implementation("androidx.core:core-ktx:1.15.0")' \
          '    implementation("androidx.appcompat:appcompat:1.7.0")' \
          '    implementation("com.google.android.material:material:1.12.0")' \
          '    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")' \
          '}' \
          > app/build.gradle.kts

          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find app -type f -name "*.apk" -print

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" apk-output/SATISFY_HealthReader_v0.3.apk

          echo "===== FINAL APK ====="
          ls -lh apk-output/SATISFY_HealthReader_v0.3.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SATISFY-HealthReader-v0.3-APK
          path: apk-output/SATISFY_HealthReader_v0.3.apk
          if-no-files-found: error
